<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remscheid switch</title>
<meta name="description" content="Contemporary Remscheid in pixel art. Vaillant headquarters and Holiday Inn Express on Lenneper Straße 164. Drag through day, night and dawn.">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; background: #08080f; overflow-x: hidden; }

  /* Each city turns its own wall. --dark follows the hours as that lens moves. */
  section {
    --dark: 0;
    --mix: calc(var(--dark) * 100%);
    --dusk: calc(var(--dark) * (1 - var(--dark)) * 4);
    --tint: color-mix(in oklab, var(--dusk-colour) calc(var(--dusk) * 62%), transparent);
    background: color-mix(in oklab, var(--night) var(--mix), var(--paper));
    background-image: linear-gradient(var(--tint), var(--tint));
    color: color-mix(in oklab, #efeaf6 var(--mix), #2a2620);
    min-height: 100svh;
    padding: 72px 24px;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 56px;
    overflow: hidden;
  }
  .remscheid { --paper: #e5e9e6; --night: #101e25; --dusk-colour: #728582; }

  .switch { width: min(680px, calc(100vw - 96px)); display: block; }
  footer {
    background: #08080f; color: #8b86a3; text-align: center; padding: 40px 24px 56px; font-size: 14px;
  }
  footer a { color: inherit; text-underline-offset: 3px; }
  kbd { font: 500 12px ui-monospace, "SF Mono", Menlo, monospace; padding: 2px 6px; border: 1px solid #26243a; border-radius: 4px; }
</style>
</head>
<body>
<section class="remscheid" aria-label="Contemporary Remscheid: Vaillant headquarters and Holiday Inn Express on Lenneper Straße 164.">
  <remscheid-switch class="switch"></remscheid-switch>
  <city-readout city="Remscheid"></city-readout>
</section>
<footer><p>Vaillant HQ · Holiday Inn Express</p>Drag to move through the hours. Tap to switch. <kbd>←</kbd> <kbd>→</kbd> step, <kbd>Space</kbd> toggles.<p><a href="remscheid-day-night-60fps.mp4" download>Download 60 fps MP4</a> · <a href="remscheid-instagram-4x5-60fps.mp4" download>Instagram 4:5 MP4</a></p><p>Instagram covers: <a href="remscheid-instagram-cover-1-daytime.jpg" download>day</a> · <a href="remscheid-instagram-cover-2-golden-hour.jpg" download>golden hour</a> · <a href="remscheid-instagram-cover-3-signs-coming-on.jpg" download>signs on</a> · <a href="remscheid-instagram-cover-4-night.jpg" download>night</a> · <a href="remscheid-instagram-cover-5-dawn.jpg" download>dawn</a> · <a href="remscheid-instagram-cover-6-morning.jpg" download>morning</a></p></footer>
<script src="city-switch.js"></script>
<script src="remscheid.js"></script>
<script>
  for (const section of document.querySelectorAll('section')) {
    const toggle = section.querySelector('.switch');
    const key = `city-switch:${section.className}`;
    toggle.addEventListener('scrub', (e) => {
      const { dark } = e.detail;
      section.style.setProperty('--dark', dark.toFixed(3));
    });
    toggle.addEventListener('change', (e) => localStorage.setItem(key, e.detail.night ? 'night' : 'day'));
    const saved = localStorage.getItem(key);
    if (saved ? saved === 'night' : matchMedia('(prefers-color-scheme: dark)').matches) toggle.jump?.(true);
  }
</script>
</body>
</html>
